<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Interativa</title>
    <style>
        :root {
            --pokedex-red: #dc0a2d;
            --pokedex-dark-red: #8b0000;
            --screen-blue: #97cbd5;
        }

        body {
            background-color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Estrutura Principal Inspirada na Imagem */
        .pokedex {
            display: flex;
            background-color: var(--pokedex-red);
            border-radius: 20px;
            padding: 20px;
            border: 5px solid black;
            box-shadow: 10px 10px 0px #222;
            max-width: 900px;
            width: 95%;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Lado Esquerdo */
        .left-panel {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .main-screen {
            background-color: #dedede;
            border: 15px solid #222;
            border-bottom-left-radius: 40px;
            height: 250px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #pokemon-img {
            width: 80%;
            height: auto;
            image-rendering: pixelated;
        }

        /* Lado Direito (Filtros e Info) */
        .right-panel {
            flex: 1;
            min-width: 300px;
            background-color: var(--pokedex-red);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-screen {
            background-color: #51ae5f; /* Verde estilo GameBoy */
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #222;
            height: 150px;
            font-size: 14px;
            color: #111;
            overflow-y: auto;
        }

        /* Estilização dos Filtros */
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input, select {
            padding: 8px;
            border-radius: 5px;
            border: 2px solid black;
            background: #fff;
        }

        .search-btn {
            grid-column: span 2;
            padding: 10px;
            background: #222;
            color: white;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .type-icon {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            margin-top: 5px;
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="pokedex">
    <div class="left-panel">
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <div style="width: 50px; height: 50px; background: cyan; border: 4px solid white; border-radius: 50%;"></div>
            <div style="width: 15px; height: 15px; background: red; border-radius: 50%;"></div>
            <div style="width: 15px; height: 15px; background: yellow; border-radius: 50%;"></div>
            <div style="width: 15px; height: 15px; background: green; border-radius: 50%;"></div>
        </div>

        <div class="main-screen">
            <img id="pokemon-img" src="https://via.placeholder.com/200?text=Carregando..." alt="Pokemon">
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="width: 40px; height: 40px; background: #222; border-radius: 50%;"></div>
            <div id="poke-number" style="font-size: 24px; font-weight: bold;">#000</div>
            <div style="width: 60px; height: 10px; background: red; border-radius: 5px;"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="info-screen" id="info-screen">
            <h2 id="poke-name" style="margin-top:0">Nome do Pokémon</h2>
            <div id="poke-type" class="type-icon">Tipo</div>
            <p id="poke-desc">Use os filtros abaixo para buscar um Pokémon na base de dados do Google Sheets.</p>
            <p><strong>Geração:</strong> <span id="poke-gen">-</span></p>
        </div>

        <div class="controls">
            <input type="text" id="search-name" placeholder="Nome...">
            <input type="text" id="search-num" placeholder="Número (ex: #001)">
            <select id="search-type">
                <option value="">Todos os Tipos</option>
                <option value="Fogo">Fogo</option>
                <option value="Agua">Água</option>
                <option value="Planta">Planta</option>
                <option value="Vento">Vento</option>
                <option value="Pedra">Pedra</option>
            </select>
            <select id="search-gen">
                <option value="">Todas Gerações</option>
                <option value="1">1ª Geração</option>
                <option value="2">2ª Geração</option>
                <option value="3">3ª Geração</option>
            </select>
            <button class="search-btn" onclick="filtrar()">Buscar na Database</button>
        </div>
    </div>
</div>

<script>
    // COLE O LINK DO SEU CSV DO GOOGLE SHEETS AQUI
    const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT9ZO1G-zKKvplEN0ABPgZ8Ot9QSAdpKT8MaZGFdIdnZgBxn2AqW4cRynR2_3-Ylw-z_QGNpBCxySN/pub?output=csv';
    
    let pokemonData = [];

    async function loadData() {
        try {
            const response = await fetch(SHEETS_URL);
            const data = await response.text();
            
            // Converte CSV para Objeto (Simples)
            const rows = data.split('\n').slice(1);
            pokemonData = rows.map(row => {
                const cols = row.split(',');
                return {
                    numero: cols[0]?.trim(),
                    nome: cols[1]?.trim(),
                    tipo: cols[2]?.trim(),
                    geracao: cols[3]?.trim(),
                    descricao: cols[4]?.trim(),
                    foto: cols[5]?.trim()
                };
            });
            console.log("Dados carregados com sucesso!");
        } catch (error) {
            console.error("Erro ao carregar dados:", error);
        }
    }

    function exibirPokemon(p) {
        document.getElementById('poke-name').innerText = p.nome;
        document.getElementById('poke-number').innerText = p.numero;
        document.getElementById('poke-type').innerText = p.tipo;
        document.getElementById('poke-desc').innerText = p.descricao;
        document.getElementById('poke-gen').innerText = p.geracao;
        document.getElementById('pokemon-img').src = p.foto;
    }

    function filtrar() {
        const nameFilter = document.getElementById('search-name').value.toLowerCase();
        const numFilter = document.getElementById('search-num').value;
        const typeFilter = document.getElementById('search-type').value;
        const genFilter = document.getElementById('search-gen').value;

        const resultado = pokemonData.find(p => {
            return (nameFilter === "" || p.nome.toLowerCase().includes(nameFilter)) &&
                   (numFilter === "" || p.numero === numFilter) &&
                   (typeFilter === "" || p.tipo === typeFilter) &&
                   (genFilter === "" || p.geracao === genFilter);
        });

        if (resultado) {
            exibirPokemon(resultado);
        } else {
            alert("Pokémon não encontrado com esses filtros!");
        }
    }

    // Carregar ao iniciar
    loadData();
</script>

</body>
</html>
