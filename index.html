<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex Interativa - Dual Type</title>
    <style>
        :root {
            --pokedex-red: #dc0a2d;
            /* Cores dos Tipos */
            --color-planta: #78C850; --color-fogo: #F08030; --color-agua: #6890F0;
            --color-vento: #A890F0; --color-pedra: #B8A038; --color-veneno: #A040A0;
            --color-eletrico: #F8D030; --color-terra: #E0C068; --color-psiquico: #F85888;
            --color-inseto: #A8B820; --color-gelo: #98D8D8; --color-dragao: #7038F8;
            --color-noturno: #705848; --color-fada: #EE99AC; --color-normal: #A8A878;
            --color-lutador: #C03028; --color-metal: #B8B8D0; --color-fantasma: #705898;
            --color-default: #705848;
        }

        body {
            background-color: #333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .pokedex {
            display: flex;
            background-color: var(--pokedex-red);
            border-radius: 20px;
            padding: 20px;
            border: 5px solid black;
            box-shadow: 10px 10px 0px #222;
            max-width: 900px;
            width: 95%;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* Painel Esquerdo */
        .left-panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 15px; }

        .main-screen {
            background-color: #dedede;
            border: 15px solid #222;
            border-bottom-left-radius: 40px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #pokemon-img { width: 70%; image-rendering: pixelated; }

        /* Painel Direito */
        .right-panel { flex: 1; min-width: 300px; display: flex; flex-direction: column; gap: 10px; }

        .info-screen {
            background-color: #51ae5f;
            padding: 15px;
            border-radius: 10px;
            border: 3px solid #222;
            min-height: 180px;
            color: #111;
        }

        /* Estilo dos Ícones de Tipo */
        .types-container { display: flex; gap: 5px; margin-bottom: 10px; }

        .type-icon {
            padding: 5px 10px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            border: 1px solid rgba(0,0,0,0.3);
            text-shadow: 1px 1px 0px rgba(0,0,0,0.5);
        }

        /* Classes de Cores Dinâmicas */
        .tipo-planta { background-color: var(--color-planta); }
        .tipo-fogo { background-color: var(--color-fogo); }
        .tipo-agua { background-color: var(--color-agua); }
        .tipo-veneno { background-color: var(--color-veneno); }
        .tipo-eletrico { background-color: var(--color-eletrico); }
        .tipo-normal { background-color: var(--color-normal); }
        .tipo-default { background-color: var(--color-default); }

        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input, select, button { padding: 10px; border: 2px solid black; font-family: inherit; border-radius: 5px; }
        .search-btn { grid-column: span 2; background: #222; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="pokedex">
    <div class="left-panel">
        <div style="display: flex; gap: 10px;">
            <div style="width: 45px; height: 45px; background: #00f2ff; border: 4px solid white; border-radius: 50%; box-shadow: 0 0 10px #fff;"></div>
        </div>
        <div class="main-screen">
            <img id="pokemon-img" src="https://via.placeholder.com/200?text=..." alt="Pokemon">
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px;">
            <div style="font-size: 28px; font-weight: bold;" id="poke-number">#000</div>
            <div style="width: 50px; height: 50px; background: #222; border-radius: 50%;"></div>
        </div>
    </div>

    <div class="right-panel">
        <div class="info-screen">
            <h2 id="poke-name" style="margin: 0 0 5px 0;">Nome</h2>
            <div id="types-wrapper" class="types-container">
                </div>
            <p id="poke-desc" style="font-size: 13px; line-height: 1.4;">Carregue os dados da planilha.</p>
            <p style="font-size: 12px; margin: 0;"><strong>Geração:</strong> <span id="poke-gen">-</span></p>
        </div>

        <div class="controls">
            <input type="text" id="search-name" list="poke-list" placeholder="Nome...">
            <datalist id="poke-list"></datalist>
            <input type="text" id="search-num" placeholder="#001">
            
            <select id="search-type">
                <option value="">Todos os Tipos</option>
                <option value="Planta">Planta</option>
                <option value="Veneno">Veneno</option>
                <option value="Fogo">Fogo</option>
                <option value="Agua">Água</option>
            </select>

            <select id="search-gen">
                <option value="">Geração</option>
                <option value="1">1ª Gen</option>
                <option value="2">2ª Gen</option>
            </select>

            <button class="search-btn" onclick="filtrar()">ANALISAR DADOS</button>
        </div>
    </div>
</div>

<script>
    const SHEETS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT9ZO1G-zKKvplEN0ABPgZ8Ot9QSAdpKT8MaZGFdIdnZgBxn2AqW4cRynR2_3-Ylw-z_QGNpBCxySN/pub?output=csv';
    let pokemonData = [];

    async function loadData() {
        try {
            const response = await fetch(SHEETS_URL);
            const data = await response.text();
            const rows = data.split('\n').slice(1);
            const dataList = document.getElementById('poke-list');
            
            pokemonData = rows.map(row => {
                const cols = row.split(',');
                const p = {
                    numero: cols[0]?.trim(),
                    nome: cols[1]?.trim(),
                    tipo: cols[2]?.trim(), // Espera "Planta / Veneno" ou apenas "Fogo"
                    geracao: cols[3]?.trim(),
                    descricao: cols[4]?.trim(),
                    foto: cols[5]?.trim()
                };
                if(p.nome) {
                    let opt = document.createElement('option');
                    opt.value = p.nome;
                    dataList.appendChild(opt);
                }
                return p;
            });
        } catch (e) { console.error(e); }
    }

    function exibirPokemon(p) {
        document.getElementById('poke-name').innerText = p.nome;
        document.getElementById('poke-number').innerText = p.numero;
        document.getElementById('poke-desc').innerText = p.descricao;
        document.getElementById('poke-gen').innerText = p.geracao;
        document.getElementById('pokemon-img').src = p.foto;

        // Lógica de Múltiplos Tipos
        const wrapper = document.getElementById('types-wrapper');
        wrapper.innerHTML = ''; // Limpa tipos anteriores

        // Divide o texto por "/" ou "," e remove espaços
        const tipos = p.tipo.split(/[/,]/); 
        
        tipos.forEach(t => {
            const tipoLimpo = t.trim();
            if (tipoLimpo) {
                const span = document.createElement('span');
                span.innerText = tipoLimpo;
                span.className = 'type-icon';
                
                // Formata nome da classe (remove acentos e espaços)
                const classeCor = 'tipo-' + tipoLimpo.toLowerCase()
                                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                                    .replace(/\s+/g, '');
                
                span.classList.add(classeCor);
                wrapper.appendChild(span);
            }
        });
    }

    function filtrar() {
        const nameF = document.getElementById('search-name').value.toLowerCase();
        const numF = document.getElementById('search-num').value;
        const typeF = document.getElementById('search-type').value;
        const genF = document.getElementById('search-gen').value;

        const res = pokemonData.find(p => {
            return (nameF === "" || p.nome.toLowerCase() === nameF) &&
                   (numF === "" || p.numero === numF) &&
                   (typeF === "" || p.tipo.includes(typeF)) && // Busca parcial no tipo
                   (genF === "" || p.geracao === genF);
        });

        if (res) exibirPokemon(res);
        else alert("Pokémon não encontrado!");
    }

    loadData();
</script>
</body>
</html>
